name: VSD Automation - Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0,1,5,6,9 * * 1-5" # Runs at 7:00 AM, 8:00 AM, 12:00 PM, 1:00 PM and 4:00 PM VN time (0:00 AM, 1:00 AM, 5:00 AM, 6:00 AM and 9:00 AM UTC), Monday to Friday
  workflow_dispatch: # Manual trigger only for testing

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch VSD data
        env:
          RUN_MODE: KEEP_DAYS
          KEEP_DAYS: 7
          LLM_BASE_URL: "https://generativelanguage.googleapis.com/v1beta/openai/"
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: "gemini-2.5-flash"
          LLM_TIMEOUT: 30
        run: |
          python scripts/fetch_vsd_llm_hybrid.py > /tmp/vsd_output.json 2>&1
          cat /tmp/vsd_output.json

      - name: Load VSD data
        id: vsd_data
        run: |
          python3 << 'EOF'
          import json
          import os

          # Load vsd_records.json
          with open('data/vsd_records.json') as f:
            data = json.load(f)

          records_count = len(data.get('records', []))
          print(f"Records: {records_count}")

          # Set GitHub output
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"records_count={records_count}\n")
          EOF

      - name: Embed data into HTML
        run: |
          python scripts/embed_data.py

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          echo "📋 Checking for modified files..."
          git status --short

          git add data/vsd_records.json data/vsd_records.xlsx index.html web/vps_automation_vhck.html docs/index.html
          echo "✓ Files staged"

          echo "🔍 Checking staged changes..."
          git diff --cached --stat

          if git diff --quiet --cached; then
            echo "✅ No changes to commit"
          else
            echo "📝 Committing changes..."
            git commit -m "ci: update VSD data with embedded HTML (${{ steps.vsd_data.outputs.records_count }} records) - $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "✓ Changes committed"

            echo "🚀 Pushing to remote..."
            git push origin main
            echo "✓ Pushed to GitHub"
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          force_orphan: false
          cname: false
